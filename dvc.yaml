stages:
  ingest:
    cmd: .venv\Scripts\python -m src.data.ingest
    deps:
      - src/data/ingest.py
      - src/data/validate.py
    params:
      - config.yaml:
          - months
          - citibike
          - stations
    outs:
      - data/raw/departures_hourly.parquet

  weather:
    cmd: .venv\Scripts\python -m src.data.weather
    deps:
      - src/data/weather.py
    params:
      - config.yaml:
          - months
          - weather
    outs:
      - data/external/weather/

  holidays:
    cmd: .venv\Scripts\python -m src.data.holidays
    deps:
      - src/data/holidays.py
    params:
      - config.yaml:
          - months
    outs:
      - data/external/holidays.parquet

  features:
    cmd: .venv\Scripts\python -m src.features.build_features
    deps:
      - src/features/build_features.py
      - data/raw/departures_hourly.parquet
      - data/external/weather/
      - data/external/holidays.parquet
    params:
      - config.yaml:
          - dataset_version
          - dataset_versions
    outs:
      - data/processed/features.parquet

  train:
    cmd: .venv\Scripts\python -m src.models.train
    deps:
      - src/models/train.py
      - src/models/baseline.py
      - src/models/metrics.py
      - configs/model.yaml
      - data/processed/features.parquet
    params:
      - config.yaml:
          - dataset_version
          - dataset_versions
      - configs/model.yaml:
          - ridge
          - tuning
          - lightgbm
    metrics:
      - reports/evaluation/latest_training_summary.json:
          cache: false

  evaluate:
    cmd: .venv\Scripts\python -m src.models.evaluate
    deps:
      - src/models/evaluate.py
      - src/models/baseline.py
      - src/models/metrics.py
      - configs/model.yaml
      - data/processed/features.parquet
      - reports/evaluation/latest_training_summary.json
    params:
      - config.yaml:
          - dataset_version
          - dataset_versions
    outs:
      - reports/evaluation/latest_evaluation.md:
          cache: false
