stages:
  ingest:
    cmd: python -m src.data.ingest
    deps:
      - src/data/ingest.py
      - src/data/validate.py
    params:
      - months
      - citibike
      - stations
    outs:
      - data/raw/departures_hourly.parquet

  weather:
    cmd: python -m src.data.weather
    deps:
      - src/data/weather.py
    params:
      - months
      - weather
    outs:
      - data/external/weather/

  holidays:
    cmd: python -m src.data.holidays
    deps:
      - src/data/holidays.py
    params:
      - months
    outs:
      - data/external/holidays.parquet

  features:
    cmd: python -m src.features.build_features
    deps:
      - src/features/build_features.py
      - data/raw/departures_hourly.parquet
      - data/external/weather/
      - data/external/holidays.parquet
    params:
      - dataset_version
      - dataset_versions
    outs:
      - data/processed/features.parquet

  train:
    cmd: python -m src.models.train
    deps:
      - src/models/train.py
      - src/models/baseline.py
      - src/models/metrics.py
      - configs/model.yaml
      - data/processed/features.parquet
    params:
      - dataset_version
      - dataset_versions
    outs:
      - reports/evaluation/latest_training_summary.json

  evaluate:
    cmd: python -m src.models.evaluate
    deps:
      - src/models/evaluate.py
      - src/models/baseline.py
      - src/models/metrics.py
      - configs/model.yaml
      - data/processed/features.parquet
      - reports/evaluation/latest_training_summary.json
    params:
      - dataset_version
      - dataset_versions
    outs:
      - reports/evaluation/evaluation_v1.md
