# ─── Dataset versions ───
# Rolling-window strategy: each version adds ~6 months of training data
# with the next 2 months held out for replay/validation
dataset_version: "v7"  # active version — uses maximum available data

dataset_versions:
  # v1: Original baseline (Jul 2023 – Apr 2024)
  v1:
    train: ["m1", "m2", "m3", "m4", "m5", "m6", "m7", "m8"]
    replay: ["m9", "m10"]

  # v2: +6 months (Jul 2023 – Jun 2024 train, Jul–Aug 2024 replay)
  v2:
    train: ["m1", "m2", "m3", "m4", "m5", "m6", "m7", "m8", "m9", "m10", "m11", "m12"]
    replay: ["m13", "m14"]

  # v3: +6 months (Jul 2023 – Dec 2024 train, Jan–Feb 2025 replay)
  v3:
    train: ["m1", "m2", "m3", "m4", "m5", "m6", "m7", "m8", "m9", "m10",
            "m11", "m12", "m13", "m14", "m15", "m16", "m17", "m18"]
    replay: ["m19", "m20"]

  # v4: +6 months (Jul 2023 – Jun 2025 train, Jul–Aug 2025 replay)
  v4:
    train: ["m1", "m2", "m3", "m4", "m5", "m6", "m7", "m8", "m9", "m10",
            "m11", "m12", "m13", "m14", "m15", "m16", "m17", "m18",
            "m19", "m20", "m21", "m22", "m23", "m24"]
    replay: ["m25", "m26"]

  # v5: +6 months (Jul 2023 – Dec 2025 train, Jan–Feb 2026 replay)
  v5:
    train: ["m1", "m2", "m3", "m4", "m5", "m6", "m7", "m8", "m9", "m10",
            "m11", "m12", "m13", "m14", "m15", "m16", "m17", "m18",
            "m19", "m20", "m21", "m22", "m23", "m24", "m25", "m26",
            "m27", "m28", "m29", "m30"]
    replay: ["m31", "m32"]

  # v6: +4 months (Jul 2023 – Apr 2026 train, May–Jun 2026 replay)
  v6:
    train: ["m1", "m2", "m3", "m4", "m5", "m6", "m7", "m8", "m9", "m10",
            "m11", "m12", "m13", "m14", "m15", "m16", "m17", "m18",
            "m19", "m20", "m21", "m22", "m23", "m24", "m25", "m26",
            "m27", "m28", "m29", "m30", "m31", "m32", "m33", "m34"]
    replay: ["m35", "m36"]

  # v7: LATEST — full dataset (Jul 2023 – Jun 2026 train, Jul–Aug 2026 replay)
  v7:
    train: ["m1", "m2", "m3", "m4", "m5", "m6", "m7", "m8", "m9", "m10",
            "m11", "m12", "m13", "m14", "m15", "m16", "m17", "m18",
            "m19", "m20", "m21", "m22", "m23", "m24", "m25", "m26",
            "m27", "m28", "m29", "m30", "m31", "m32", "m33", "m34",
            "m35", "m36"]
    replay: ["m37", "m38"]

# ─── Station selection ───
stations:
  top_n: 30  # fixed from dataset v1

# ─── Citi Bike data source ───
citibike:
  base_url: "https://s3.amazonaws.com/tripdata"
  file_pattern: "JC-{yyyymm}-citibike-tripdata.csv.zip"

# ─── Weather (Open-Meteo) ───
weather:
  api_url: "https://archive-api.open-meteo.com/v1/archive"
  latitude: 40.7128
  longitude: -74.0060
  hourly_vars:
    - temperature_2m
    - precipitation
    - wind_speed_10m
  timezone: "America/New_York"
