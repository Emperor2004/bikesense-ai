<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BikeSense AI — Demand Forecasting Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --danger: #ef4444;
      --header-gradient: linear-gradient(135deg, #60a5fa 0%, #34d399 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--card-border);
    }

    .brand h1 {
      font-size: 2rem;
      font-weight: 700;
      background: var(--header-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background: #34d399;
      border-radius: 50%;
      box-shadow: 0 0 10px #34d399;
    }

    .grid-top {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .metric-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .metric-card span {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .metric-card h3 {
      font-size: 1.5rem;
      margin-top: 0.5rem;
      color: #fff;
    }

    .control-panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      align-items: flex-end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
      min-width: 200px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    input, select {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.75rem 1.75rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: var(--primary-hover);
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
    }

    .chart-container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1.75rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .chart-header h2 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .chart-wrapper {
      position: relative;
      height: 380px;
      width: 100%;
    }

    .status-msg {
      font-size: 0.9rem;
      margin-top: 0.5rem;
      min-height: 1.2rem;
    }

    .text-danger { color: var(--danger); }
    .text-success { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>BikeSense AI</h1>
        <p>24-Hour Station Demand Forecasting & Operational Dashboard</p>
      </div>
      <div class="badge" id="serviceBadge">
        <div class="badge-dot"></div>
        <span id="serviceStatus">Connecting...</span>
      </div>
    </header>

    <div class="grid-top">
      <div class="metric-card">
        <span>Active Model</span>
        <h3 id="modelName">--</h3>
      </div>
      <div class="metric-card">
        <span>Champion Version</span>
        <h3 id="modelVer">--</h3>
      </div>
      <div class="metric-card">
        <span>Git Lineage Commit</span>
        <h3 id="gitCommit" style="font-size: 1.1rem; font-family: monospace;">--</h3>
      </div>
      <div class="metric-card">
        <span>Service Uptime</span>
        <h3 id="serviceUptime">--</h3>
      </div>
    </div>

    <div class="control-panel">
      <div class="form-group">
        <label for="stationSelect">Citi Bike Station</label>
        <select id="stationSelect">
          <option value="JC014">JC014 — Grove St PATH</option>
          <option value="JC009">JC009 — Newport Pkwy</option>
          <option value="JC106">JC106 — Exchange Place</option>
          <option value="JC013">JC013 — Hamilton Park</option>
          <option value="JC051">JC051 — Marin Blvd</option>
        </select>
      </div>

      <div class="form-group">
        <label for="forecastDate">Forecast Date</label>
        <input type="date" id="forecastDate" value="2024-03-15">
      </div>

      <button id="fetchBtn" onclick="fetchForecast()">Generate 24h Forecast</button>
      <div class="status-msg" id="statusMsg"></div>
    </div>

    <div class="chart-container">
      <div class="chart-header">
        <h2>Hourly Departure Demand Forecast</h2>
        <span id="totalDemand" style="color: #60a5fa; font-weight: 600;">Total Predicted: -- departures</span>
      </div>
      <div class="chart-wrapper">
        <canvas id="forecastChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    let chartInstance = null;

    async function loadHealthAndModel() {
      try {
        const hRes = await fetch('/health');
        if (hRes.ok) {
          const hData = await hRes.json();
          document.getElementById('serviceStatus').innerText = 'Online (' + hData.status + ')';
          document.getElementById('modelName').innerText = hData.model_name || 'DemandForecaster';
          document.getElementById('modelVer').innerText = 'v' + (hData.active_champion_version || '1');
          document.getElementById('serviceUptime').innerText = Math.round(hData.uptime_seconds) + 's';
        }
        const mRes = await fetch('/model-info');
        if (mRes.ok) {
          const mData = await mRes.json();
          const gitShort = mData.git_commit ? mData.git_commit.substring(0, 7) : 'latest';
          document.getElementById('gitCommit').innerText = gitShort;
        }
      } catch (err) {
        document.getElementById('serviceStatus').innerText = 'Offline';
        document.getElementById('serviceBadge').style.background = 'rgba(239, 68, 68, 0.2)';
        document.getElementById('serviceBadge').style.color = '#ef4444';
      }
    }

    async function fetchForecast() {
      const station = document.getElementById('stationSelect').value;
      const date = document.getElementById('forecastDate').value;
      const msg = document.getElementById('statusMsg');
      const btn = document.getElementById('fetchBtn');

      if (!date) {
        msg.innerHTML = '<span class="text-danger">Please choose a valid date.</span>';
        return;
      }

      msg.innerHTML = '<span>Loading forecast...</span>';
      btn.disabled = true;

      try {
        const res = await fetch(`/forecast?station_id=${encodeURIComponent(station)}&date=${encodeURIComponent(date)}`);
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || 'Failed to fetch forecast');
        }
        const data = await res.json();
        msg.innerHTML = '<span class="text-success">Forecast generated successfully!</span>';
        document.getElementById('totalDemand').innerText = `Total Predicted: ${data.total_predicted_departures} departures`;
        renderChart(data.forecasts);
      } catch (err) {
        msg.innerHTML = `<span class="text-danger">Error: ${err.message}</span>`;
      } finally {
        btn.disabled = false;
      }
    }

    function renderChart(forecasts) {
      const labels = forecasts.map(f => `${String(f.hour).padStart(2, '0')}:00`);
      const values = forecasts.map(f => f.predicted_departures);

      if (chartInstance) {
        chartInstance.destroy();
      }

      const ctx = document.getElementById('forecastChart').getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 0, 350);
      gradient.addColorStop(0, 'rgba(59, 130, 246, 0.5)');
      gradient.addColorStop(1, 'rgba(59, 130, 246, 0.0)');

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Predicted Departures',
            data: values,
            borderColor: '#3b82f6',
            backgroundColor: gradient,
            borderWidth: 3,
            fill: true,
            tension: 0.35,
            pointBackgroundColor: '#60a5fa',
            pointRadius: 4,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#1e293b',
              titleColor: '#f8fafc',
              bodyColor: '#93c5fd',
              borderColor: 'rgba(255,255,255,0.1)',
              borderWidth: 1,
              callbacks: {
                label: (ctx) => `Demand: ${ctx.parsed.y} departures`
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { color: '#94a3b8' }
            },
            y: {
              beginAtZero: true,
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { color: '#94a3b8' }
            }
          }
        }
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadHealthAndModel();
      fetchForecast();
    });
  </script>
</body>
</html>
