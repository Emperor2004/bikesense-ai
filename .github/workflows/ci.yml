name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linting
        run: |
          ruff check src/ app/ service/ tests/

  unit-and-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-code-quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --tb=short --cov=src --cov=app --cov-report=xml --cov-report=term

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage.xml
          retention-days: 7

  service-health-verification:
    name: API Service Health Verification
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reproduce DVC Pipeline (Ensure Model Artifact Exists)
        run: |
          dvc repro --no-run-cache || echo "DVC repro skipped — using cached artifacts"

      - name: Start FastAPI Server & Verify Healthcheck
        run: |
          # Start uvicorn in background
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 8
          
          # Test /health endpoint
          echo "Testing /health endpoint..."
          curl --retry 5 --retry-delay 2 --retry-connrefused -f http://localhost:8000/health
          echo ""
          
          # Test /model-info endpoint
          echo "Testing /model-info endpoint..."
          curl -f http://localhost:8000/model-info
          echo ""
          
          echo "All health checks passed!"
          
          # Cleanup
          kill $SERVER_PID 2>/dev/null || true
