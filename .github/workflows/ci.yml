name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── JOB 1: Code Quality & Linting ──────────────────────────────────────────
  lint-and-code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linting
        run: ruff check src/ app/ service/ tests/

  # ── JOB 2: Unit & Integration Tests ────────────────────────────────────────
  unit-and-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-code-quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --tb=short --cov=src --cov=app --cov-report=xml --cov-report=term

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage.xml
          retention-days: 7

  # ── JOB 3: Docker Build & Healthcheck ──────────────────────────────────────
  docker-build-verification:
    name: Docker Build & Health Verification
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Stub MLflow Artifacts for CI Build
        # mlflow.db and mlruns/ are git-ignored (contain large trained models).
        # In CI we create minimal stubs so the Dockerfile COPY succeeds.
        # The health endpoint is designed to start without a champion model.
        run: |
          python3 - << 'EOF'
          import sqlite3, pathlib, os

          # Create a minimal MLflow SQLite database with the required schema
          db = sqlite3.connect("mlflow.db")
          db.executescript("""
            CREATE TABLE IF NOT EXISTS experiments (
              experiment_id TEXT PRIMARY KEY,
              name TEXT,
              artifact_location TEXT,
              lifecycle_stage TEXT,
              creation_time INTEGER,
              last_update_time INTEGER
            );
            CREATE TABLE IF NOT EXISTS runs (
              run_uuid TEXT PRIMARY KEY,
              name TEXT,
              source_type TEXT,
              source_name TEXT,
              entry_point_name TEXT,
              user_id TEXT,
              status TEXT,
              start_time INTEGER,
              end_time INTEGER,
              source_version TEXT,
              lifecycle_stage TEXT,
              artifact_uri TEXT,
              experiment_id TEXT
            );
            INSERT OR IGNORE INTO experiments VALUES
              ('0','Default','file:///app/mlruns/0','active',0,0);
          """)
          db.commit()
          db.close()

          # Create empty mlruns directory structure
          pathlib.Path("mlruns/0").mkdir(parents=True, exist_ok=True)
          pathlib.Path("mlruns/0/meta.yaml").write_text(
              "artifact_location: file:///app/mlruns/0\n"
              "experiment_id: '0'\n"
              "lifecycle_stage: active\n"
              "name: Default\n"
          )
          print("Stub mlflow.db and mlruns/ created for CI build.")
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: bikesense-forecast:ci
          load: true

      - name: Start Container & Verify Health
        run: |
          docker run -d -p 8000:8000 --name bikesense-ci bikesense-forecast:ci
          echo "Waiting for container to start..."
          sleep 15
          echo "--- Testing /health ---"
          curl --retry 8 --retry-delay 3 --retry-connrefused \
               --retry-all-errors -sf http://localhost:8000/health
          echo ""
          echo "--- All health checks passed! ---"
          docker stop bikesense-ci
