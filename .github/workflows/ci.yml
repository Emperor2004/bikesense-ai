name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── JOB 1: Code Quality & Linting ──────────────────────────────────────────
  lint-and-code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linting
        run: ruff check src/ app/ service/ tests/

  # ── JOB 2: Unit & Integration Tests ────────────────────────────────────────
  unit-and-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-code-quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --tb=short --cov=src --cov=app --cov-report=xml --cov-report=term

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage.xml
          retention-days: 7

  # ── JOB 3: Docker Build & Healthcheck ──────────────────────────────────────
  docker-build-verification:
    name: Docker Build & Health Verification
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create Stub MLflow Artifacts for CI Build
        # mlflow.db and mlruns/ are gitignored (contain large model artifacts).
        # We initialize a clean MLflow SQLite DB using MLflow directly so Alembic migrations match.
        run: |
          pip install --no-cache-dir mlflow-skinny
          python3 -c "
          import mlflow
          mlflow.set_tracking_uri('sqlite:///mlflow.db')
          from mlflow.tracking import MlflowClient
          client = MlflowClient()
          try:
              client.create_registered_model('bikesense-demand-forecaster')
          except Exception:
              pass
          print('Clean MLflow registry database initialized for CI container build.')
          "
          mkdir -p mlruns/0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: bikesense-forecast:ci
          load: true

      - name: Start Container & Verify Health
        run: |
          docker run -d -p 8000:8000 --name bikesense-ci bikesense-forecast:ci
          echo "Waiting for container to start..."
          sleep 10
          echo "Container status:"
          docker ps -a
          echo "--- Testing /health ---"
          curl --retry 10 --retry-delay 3 --retry-connrefused \
               --retry-all-errors -sf http://localhost:8000/health
          echo ""
          echo "--- Testing dashboard root / ---"
          curl -sf http://localhost:8000/ > /dev/null
          echo "Dashboard UI served successfully (HTTP 200)!"
          echo "--- All health checks passed! ---"
          docker stop bikesense-ci
