name: CD — Deploy to Amazon EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

jobs:
  build-and-push-ecr:
    name: Build & Push Image to AWS ECR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'bikesense-forecaster' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy-to-ec2:
    name: Deploy Container to EC2 Instance
    runs-on: ubuntu-latest
    needs: build-and-push-ecr
    steps:
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem

      - name: Pull and Restart Container on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'bikesense-forecaster' }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2.pem $EC2_USER@$EC2_HOST << 'EOF'
            set -e
            echo "Authenticating Docker with AWS ECR..."
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com
            
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            IMAGE_URI="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest"
            
            echo "Pulling latest image: $IMAGE_URI"
            docker pull $IMAGE_URI
            
            echo "Stopping existing container if running..."
            docker stop bikesense-service || true
            docker rm bikesense-service || true
            
            echo "Starting updated container..."
            docker run -d \
              --name bikesense-service \
              --restart unless-stopped \
              -p 8000:8000 \
              $IMAGE_URI
            
            echo "Verifying service health on EC2..."
            sleep 5
            curl -f http://localhost:8000/health
            echo "Deployment successful!"
          EOF
