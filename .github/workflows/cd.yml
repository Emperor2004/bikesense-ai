name: CD — Deploy to Amazon EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

jobs:
  # ── JOB 1: Build & Push Docker Image to Amazon ECR ─────────────────────────
  build-and-push-ecr:
    name: Build & Push Image to AWS ECR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create Stub MLflow Artifacts
        # mlflow.db and mlruns/ are gitignored (large model binaries).
        # We initialize a clean MLflow SQLite DB using MLflow directly so Alembic migrations match.
        run: |
          pip install --no-cache-dir mlflow-skinny
          python3 -c "
          import mlflow
          mlflow.set_tracking_uri('sqlite:///mlflow.db')
          from mlflow.tracking import MlflowClient
          client = MlflowClient()
          try:
              client.create_registered_model('bikesense-demand-forecaster')
          except Exception:
              pass
          print('Clean MLflow registry database initialized for ECR build.')
          "
          mkdir -p mlruns/0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, Tag & Push Image to ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'bikesense-forecaster' }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          echo "=== Checking / creating ECR repository: $ECR_REPOSITORY ==="
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" 2>/dev/null || \
          aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION" || true

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Building Docker image: $IMAGE_URI"
          docker build \
            -t "$IMAGE_URI" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .

          echo "Pushing Docker image to Amazon ECR: $IMAGE_URI"
          docker push "$IMAGE_URI"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  # ── JOB 2: Deploy Container to EC2 ─────────────────────────────────────────
  deploy-to-ec2:
    name: Deploy Container to EC2 Instance
    runs-on: ubuntu-latest
    needs: build-and-push-ecr
    steps:
      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST:         ${{ secrets.EC2_HOST }}
          EC2_USER:         ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_KEY:          ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          AWS_REGION:       ${{ secrets.AWS_REGION || 'us-east-1' }}
          ECR_REPOSITORY:   ${{ secrets.ECR_REPOSITORY || 'bikesense-forecaster' }}
          IMAGE_URI:        ${{ needs.build-and-push-ecr.outputs.image_uri }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_KEY" ]; then
            echo "Notice: EC2_HOST or EC2_SSH_PRIVATE_KEY is not configured in GitHub Secrets."
            echo "Skipping EC2 deployment. The container image was successfully built and pushed to Amazon ECR."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" \
            "AWS_REGION='$AWS_REGION' ECR_REPOSITORY='$ECR_REPOSITORY' IMAGE_URI='$IMAGE_URI' bash -s" << 'ENDSSH'
            set -e

            echo "=== Authenticating Docker with AWS ECR ==="
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            ECR_REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            echo "=== Pulling image: $IMAGE_URI ==="
            docker pull "$IMAGE_URI"

            echo "=== Replacing running container ==="
            docker stop bikesense-service 2>/dev/null || true
            docker rm   bikesense-service 2>/dev/null || true

            docker run -d \
              --name bikesense-service \
              --restart unless-stopped \
              -p 8000:8000 \
              "$IMAGE_URI"

            echo "=== Verifying service health ==="
            sleep 8
            curl --retry 5 --retry-delay 2 --retry-connrefused \
                 --retry-all-errors -sf http://localhost:8000/health
            echo ""
            echo "=== Deployment successful! ==="
          ENDSSH
