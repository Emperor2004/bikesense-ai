name: CD — Deploy to Amazon EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

jobs:
  # ── JOB 1: Build & Push Docker Image to Amazon ECR ─────────────────────────
  build-and-push-ecr:
    name: Build & Push Image to AWS ECR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create Stub MLflow Artifacts (if not in repo)
        # mlflow.db and mlruns/ are gitignored; create stubs so COPY succeeds in Docker build
        run: |
          if [ ! -f mlflow.db ]; then
            python3 - << 'EOF'
          import sqlite3, pathlib
          db = sqlite3.connect("mlflow.db")
          db.executescript("""
            CREATE TABLE IF NOT EXISTS experiments (
              experiment_id TEXT PRIMARY KEY, name TEXT,
              artifact_location TEXT, lifecycle_stage TEXT,
              creation_time INTEGER, last_update_time INTEGER
            );
            CREATE TABLE IF NOT EXISTS runs (
              run_uuid TEXT PRIMARY KEY, name TEXT,
              source_type TEXT, source_name TEXT, entry_point_name TEXT,
              user_id TEXT, status TEXT, start_time INTEGER, end_time INTEGER,
              source_version TEXT, lifecycle_stage TEXT,
              artifact_uri TEXT, experiment_id TEXT
            );
            INSERT OR IGNORE INTO experiments VALUES
              ('0','Default','file:///app/mlruns/0','active',0,0);
          """)
          db.commit(); db.close()
          pathlib.Path("mlruns/0").mkdir(parents=True, exist_ok=True)
          pathlib.Path("mlruns/0/meta.yaml").write_text(
              "artifact_location: file:///app/mlruns/0\nexperiment_id: '0'\n"
              "lifecycle_stage: active\nname: Default\n"
          )
          print("Stub mlflow.db and mlruns/ created.")
          EOF
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, Tag & Push Image to ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'bikesense-forecaster' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build \
            -t "$IMAGE_URI" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$IMAGE_URI"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  # ── JOB 2: Deploy Container to EC2 ─────────────────────────────────────────
  deploy-to-ec2:
    name: Deploy Container to EC2 Instance
    runs-on: ubuntu-latest
    needs: build-and-push-ecr
    if: ${{ secrets.EC2_HOST != '' && secrets.EC2_SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem

      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST:         ${{ secrets.EC2_HOST }}
          EC2_USER:         ${{ secrets.EC2_USER || 'ubuntu' }}
          AWS_REGION:       ${{ secrets.AWS_REGION || 'us-east-1' }}
          ECR_REPOSITORY:   ${{ secrets.ECR_REPOSITORY || 'bikesense-forecaster' }}
          IMAGE_URI:        ${{ needs.build-and-push-ecr.outputs.image_uri }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" \
            "AWS_REGION='$AWS_REGION' ECR_REPOSITORY='$ECR_REPOSITORY' IMAGE_URI='$IMAGE_URI' bash -s" << 'ENDSSH'
            set -e

            echo "=== Authenticating Docker with AWS ECR ==="
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            ECR_REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            echo "=== Pulling image: $IMAGE_URI ==="
            docker pull "$IMAGE_URI"

            echo "=== Replacing running container ==="
            docker stop bikesense-service 2>/dev/null || true
            docker rm   bikesense-service 2>/dev/null || true

            docker run -d \
              --name bikesense-service \
              --restart unless-stopped \
              -p 8000:8000 \
              "$IMAGE_URI"

            echo "=== Verifying service health ==="
            sleep 8
            curl --retry 5 --retry-delay 2 --retry-connrefused \
                 --retry-all-errors -sf http://localhost:8000/health
            echo ""
            echo "=== Deployment successful! ==="
          ENDSSH
