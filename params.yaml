# params.yaml
# Central configuration for the housing-price DVC pipeline.
# Every stage script reads only its own block — keeps stages decoupled.

data_ingestion:
  raw_data_path: datasets/housing.csv
  train_path: datasets/raw/train.csv
  test_path: datasets/raw/test.csv
  test_size: 0.2
  random_state: 42

data_preprocessing:
  train_in: datasets/raw/train.csv
  test_in: datasets/raw/test.csv
  train_out: datasets/processed/train.csv
  test_out: datasets/processed/test.csv
  target_column: price
  binary_yes_no_columns:
    - mainroad
    - guestroom
    - basement
    - hotwaterheating
    - airconditioning
    - prefarea
  categorical_columns:
    - furnishingstatus

feature_engineering:
  train_in: datasets/processed/train.csv
  test_in: datasets/processed/test.csv
  train_out: datasets/features/train.csv
  test_out: datasets/features/test.csv
  target_column: price
  scaler_path: models/scaler.pkl
  scale_features: true
  add_derived_features: true

model_training:
  train_path: datasets/features/train.csv
  target_column: price
  model_path: models/model.pkl
  model_name: random_forest   # random_forest | linear_regression
  random_state: 42
  n_estimators: 500
  max_depth: 50

model_evaluation:
  test_path: datasets/features/test.csv
  model_path: models/model.pkl
  target_column: price
  metrics_path: metrics.json
